name: Static checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  history-secrets:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out complete repository history
        # Full history is required so deleted/rotated secrets cannot evade CI.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan complete Git history for secrets
        shell: bash
        run: python3 scripts/scan-secrets.py --history

  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        # Pin the action to an exact commit rather than a moving major tag.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext shellcheck patch

      - name: Run repository static checks
        shell: bash
        run: bash scripts/check-static.sh

  validate-fedora:
    runs-on: ubuntu-24.04
    container:
      image: fedora:44

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Fedora validation tools
        run: |
          dnf install -y bash python3 gettext ShellCheck git patch

      - name: Run repository static checks on Fedora
        shell: bash
        run: bash scripts/check-static.sh
