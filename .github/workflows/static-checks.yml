name: Static checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ubuntu:
    name: Portable static checks (Ubuntu)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        # Pin the action to an exact commit rather than a moving major tag.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext shellcheck patch

      - name: Run repository static checks
        shell: bash
        run: bash scripts/check-static.sh


  validate-fedora:
    name: Fedora 44 contract checks
    runs-on: ubuntu-24.04
    container:
      image: fedora:44

    steps:
      - name: Install checkout prerequisites
        run: dnf install -y git tar gzip ca-certificates

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install validation tools
        run: |
          dnf install -y gettext ShellCheck patch python3 findutils

      - name: Run repository static checks on Fedora
        shell: bash
        run: bash scripts/check-static.sh
